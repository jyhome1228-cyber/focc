<!-- HEROES OF KOREA / Cafe24 replacement header -->
<!--@css(/layout/basic/css/focc-shell.css)-->
<header class="focc-header" id="focc-header">
  <div class="focc-header-inner">
    <a class="focc-header-logo" href="/" aria-label="히어로즈 오브 코리아 홈">
      <img src="https://jyhome1228-cyber.github.io/focc/assets/heroes-of-korea-logo.svg" alt="HEROES of KOREA" width="180" height="45">
    </a>

    <nav class="focc-desktop-nav" aria-label="주 메뉴">
      <a href="/product/list.html?cate_no=45">Perfume</a>
      <a href="/product/list.html?cate_no=54">Lifestyle</a>
      <a href="/board/gallery/list.html?board_no=8">Press</a>
      <a href="https://jyhome1228-cyber.github.io/focc/about.html">About Us</a>
      <a href="https://jyhome1228-cyber.github.io/focc/global.html">Global</a>
    </nav>

    <div class="focc-header-actions">
      <div class="focc-login" module="Layout_statelogoff">
        <a href="/member/login.html" aria-label="로그인" title="로그인">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4.2 3.1-6.5 7.5-6.5s7.5 2.3 7.5 6.5"/></svg>
        </a>
      </div>
      <div class="focc-login" module="Layout_stateLogon">
        <a href="/myshop/index.html" aria-label="마이페이지" title="마이페이지">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4.2 3.1-6.5 7.5-6.5s7.5 2.3 7.5 6.5"/></svg>
        </a>
        <a href="{$action_logout}" class="focc-logout">로그아웃</a>
      </div>
      <a href="/order/basket.html" aria-label="장바구니" title="장바구니">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8h17l-1.4 12h-14zM8.5 9V6a3.5 3.5 0 0 1 7 0v3"/></svg>
      </a>
      <a href="/product/search.html" aria-label="상품 검색" title="검색">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </a>
      <button id="focc-menu-toggle" class="focc-menu-toggle" type="button" aria-label="메뉴 열기" aria-controls="focc-mobile-nav" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
      </button>
    </div>
  </div>
  <nav id="focc-mobile-nav" class="focc-mobile-nav" aria-label="모바일 주 메뉴" hidden>
    <a href="/">Home</a>
    <a href="/product/list.html?cate_no=45">Perfume</a>
    <a href="/product/list.html?cate_no=54">Lifestyle</a>
    <a href="/board/gallery/list.html?board_no=8">Press</a>
    <a href="https://jyhome1228-cyber.github.io/focc/about.html">About Us</a>
    <a href="https://jyhome1228-cyber.github.io/focc/global.html">Global</a>
    <a href="/myshop/order/list.html">Order History</a>
  </nav>
</header>
<script>
(function(){
  var button=document.getElementById('focc-menu-toggle');
  var nav=document.getElementById('focc-mobile-nav');
  if(!button||!nav)return;
  button.addEventListener('click',function(){
    var open=button.getAttribute('aria-expanded')!=='true';
    button.setAttribute('aria-expanded',String(open));
    nav.hidden=!open;
  });
  nav.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click',function(){nav.hidden=true;button.setAttribute('aria-expanded','false');});
  });
})();
</script>
